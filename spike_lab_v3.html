<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Spike Lab V4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#00ff88;--o:#ffaa00;--r:#ff3355;--b:#00bbff;--p:#aa55ff;--bg:#03060a;--card:#08111a;--border:#0f2035;--dim:#3a5570;--text:#ccddef}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh}

/* HEADER */
.hdr{background:linear-gradient(180deg,#0a1e30,#050d14);border-bottom:2px solid #0d2540;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;background:linear-gradient(90deg,#aa55ff,#00bbff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:8px;color:var(--dim);letter-spacing:2px;-webkit-text-fill-color:var(--dim)}
.hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:14px;font-size:10px;font-weight:700;background:#060f18;border:1px solid var(--border)}
.pill span{font-family:'Orbitron',monospace;color:var(--o)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.dot.on{background:var(--g);box-shadow:0 0 8px var(--g);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.btn{padding:6px 14px;border-radius:18px;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;border:none;cursor:pointer}
.btn-go{background:linear-gradient(90deg,#00cc66,#00ff88);color:#000}
.btn-stop{background:linear-gradient(90deg,#cc0022,#ff3355);color:#fff}

/* GRID PAIRES */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
.pcard{background:var(--card);padding:10px;position:relative}
.pname{font-family:'Orbitron',monospace;font-size:9px;color:var(--dim);letter-spacing:1px;margin-bottom:4px}
.spikes-count{font-family:'Orbitron',monospace;font-size:28px;font-weight:900;text-align:center;color:var(--o)}
.spikes-label{text-align:center;font-size:8px;color:var(--dim);letter-spacing:2px;margin-bottom:8px}

/* SIGNAL PRINCIPAL */
.signal-box{border-radius:8px;padding:8px;margin-bottom:8px;text-align:center;border:1px solid var(--border);background:#060f18;transition:.3s}
.signal-box.scalp-sell{background:rgba(255,51,85,.1);border-color:var(--r)}
.signal-box.scalp-buy{background:rgba(0,255,136,.1);border-color:var(--g)}
.signal-box.spike-alert{background:rgba(255,170,0,.15);border-color:var(--o);animation:glow .5s infinite}
.signal-box.spike-imminent{background:rgba(255,51,85,.2);border-color:var(--r);animation:pulse .4s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 10px rgba(255,170,0,.3)}50%{box-shadow:0 0 25px rgba(255,170,0,.6)}}
@keyframes pulse{0%,100%{box-shadow:0 0 15px rgba(255,51,85,.4)}50%{box-shadow:0 0 35px rgba(255,51,85,.8)}}
.signal-icon{font-size:20px;margin-bottom:2px}
.signal-text{font-family:'Orbitron',monospace;font-size:11px;font-weight:900}
.signal-sub{font-size:9px;color:var(--dim);margin-top:2px}

/* TICK COUNTER */
.tc{background:#060f18;border:1px solid var(--border);border-radius:6px;padding:7px;margin-bottom:6px}
.tc-top{display:flex;justify-content:space-between;margin-bottom:3px}
.tc-lbl{font-size:9px;color:var(--dim)}
.tc-val{font-family:'Orbitron',monospace;font-size:10px;color:var(--b)}
.tc-prob{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;text-align:center;margin-bottom:3px}
.tc-bar{background:#0a1828;border-radius:3px;height:8px;overflow:hidden}
.tc-fill{height:100%;border-radius:3px;transition:width .3s}

/* 5 INDICATEURS */
.ind5{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:6px}
.ind-row{display:flex;justify-content:space-between;align-items:center;padding:3px 5px;background:#060f18;border-radius:3px;border-left:2px solid var(--dim)}
.ind-row.active{border-left-color:var(--g)}
.in{font-size:8px;color:var(--dim)}
.iv{font-family:'Orbitron',monospace;font-size:8px;color:var(--dim)}
.iv.active{color:var(--g);text-shadow:0 0 5px var(--g)}

/* DIRECTION SCALP */
.direction{display:flex;justify-content:space-between;gap:4px;margin-bottom:6px}
.dir-box{flex:1;text-align:center;padding:4px;border-radius:4px;background:#060f18;border:1px solid var(--border)}
.dir-box.active-sell{background:rgba(255,51,85,.15);border-color:var(--r)}
.dir-box.active-buy{background:rgba(0,255,136,.15);border-color:var(--g)}
.dir-label{font-size:8px;color:var(--dim)}
.dir-val{font-family:'Orbitron',monospace;font-size:10px;font-weight:900}

/* SECTIONS */
.sec{font-family:'Orbitron',monospace;font-size:9px;color:var(--p);padding:7px 16px;background:#050d14;border-top:1px solid var(--border);border-bottom:1px solid var(--border);letter-spacing:2px}

/* COMPTEUR GLOBAL */
.trgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--border)}
.trcard{background:var(--card);padding:8px;text-align:center;border:1px solid transparent}
.tr-sym{font-size:8px;color:var(--dim);margin-bottom:2px}
.tr-pct{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;margin-bottom:2px}
.tr-sub{font-size:8px;color:var(--dim);margin-bottom:3px}
.tr-bar{background:#0a1828;border-radius:3px;height:6px;overflow:hidden}
.tr-fill{height:100%;border-radius:3px;transition:width .5s}
.talert{background:rgba(255,51,85,.08);border:1px solid var(--r)!important;animation:pulse .8s infinite}

/* CLASSEMENT 5 IND */
.i5grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border)}
.i5card{background:var(--card);padding:8px;text-align:center;border:1px solid transparent}
.i5n{font-size:9px;color:var(--o);font-weight:700;margin-bottom:2px}
.i5d{font-size:7px;color:var(--dim);margin-bottom:4px}
.i5pct{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;margin-bottom:2px}
.i5sub{font-size:7px;color:var(--dim)}
.i5bar{background:#0a1828;border-radius:2px;height:3px;margin-top:4px;overflow:hidden}
.i5fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--p),var(--b))}
.winner{border:1px solid var(--p)!important;box-shadow:0 0 12px rgba(170,85,255,.2)!important}

/* JOURNAL */
.jtable{width:100%;border-collapse:collapse;font-size:9px}
.jtable th{padding:5px 7px;background:#060f18;color:var(--dim);text-align:left;font-size:8px;letter-spacing:1px}
.jtable td{padding:3px 7px;border-bottom:1px solid #0a1828}
.jtable tr:hover td{background:#060f18}
.bs{padding:1px 5px;border-radius:6px;font-size:8px;font-weight:700}
.bsc{background:rgba(0,255,136,.1);color:var(--g);border:1px solid rgba(0,255,136,.3)}
.bss{background:rgba(255,51,85,.1);color:var(--r);border:1px solid rgba(255,51,85,.3)}
.bsal{background:rgba(255,170,0,.1);color:var(--o);border:1px solid rgba(255,170,0,.3)}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="logo">SPIKE LAB V4</div>
    <div class="logo-sub">5 INDICATEURS GAGNANTS — SCALP + SPIKE — DERIV API</div>
  </div>
  <div class="hright">
    <div class="pill">Ticks <span id="gT">0</span></div>
    <div class="pill">Spikes <span id="gS">0</span></div>
    <div class="pill">Scalps <span id="gSc">0</span></div>
    <div class="pill" style="font-family:'Orbitron',monospace;font-size:11px;color:var(--b)" id="clk">00:00:00</div>
    <div class="pill" style="font-family:'Orbitron',monospace;font-size:10px;color:var(--o)" id="sess">00:00:00</div>
    <div class="pill"><div class="dot" id="dot"></div><span id="cTxt" style="font-size:9px;margin-left:3px">OFF</span></div>
    <button class="btn btn-go" id="btnGo" onclick="startAll()">▶ DÉMARRER</button>
    <button class="btn btn-stop" id="btnStop" onclick="stopAll()" style="display:none">■ ARRÊTER</button>
  </div>
</div>

<div class="pgrid" id="pgrid"></div>
<div class="sec">⚡ COMPTEUR DE TICKS — PROBABILITÉ SPIKE</div>
<div class="trgrid" id="trgrid"></div>
<div class="sec">🏆 CLASSEMENT — 5 INDICATEURS GAGNANTS (50 TICKS AVANT SPIKE)</div>
<div class="i5grid" id="i5grid"></div>
<div class="sec" style="color:var(--g)">■ JOURNAL TEMPS RÉEL</div>
<table class="jtable">
  <thead><tr>
    <th>HEURE</th><th>PAIRE</th><th>SIGNAL</th><th>TICKS/MAX</th><th>PROB%</th><th>IND ACTIFS</th><th>DIRECTION</th><th>ACTION</th>
  </tr></thead>
  <tbody id="jbody"></tbody>
</table>

<script>
const PAIRS=[
  {id:'BOOM300',sym:'BOOM 300',type:'boom',max:300},
  {id:'BOOM500',sym:'BOOM 500',type:'boom',max:500},
  {id:'BOOM1000',sym:'BOOM 1000',type:'boom',max:1000},
  {id:'CRASH300',sym:'CRASH 300',type:'crash',max:300},
  {id:'CRASH500',sym:'CRASH 500',type:'crash',max:500},
  {id:'CRASH1000',sym:'CRASH 1000',type:'crash',max:1000},
];

// 5 INDICATEURS GAGNANTS UNIQUEMENT
const IND=[
  {id:'rsi',  n:'RSI(2)',      d:'Seuils 10/90 — ultra réactif'},
  {id:'stoch',n:'STOCH(3)',    d:'Closes 15/85 — rapide'},
  {id:'wil',  n:'WILLIAMS(3)', d:'Closes -90/-10 — momentum'},
  {id:'dem',  n:'DeMARK(8)',   d:'0.3/0.7 — retournement'},
  {id:'mom',  n:'MOMENTUM(3)', d:'Accélération prix brute'},
];

let ws={},ST={},running=false,t0=null,gT=0,gS=0,gSc=0;

function initST(){
  // Charger sauvegarde
  try{
    let saved=localStorage.getItem('slabV4');
    if(saved){
      let d=JSON.parse(saved);
      gT=d.gT||0;gS=d.gS||0;gSc=d.gSc||0;
      document.getElementById('gT').textContent=gT;
      document.getElementById('gS').textContent=gS;
      document.getElementById('gSc').textContent=gSc;
    }
  }catch(e){}

  ST={};
  PAIRS.forEach(p=>{
    let ih={},it={};
    IND.forEach(i=>{ih[i.id]=0;it[i.id]=0;});
    // Restaurer stats sauvegardées
    try{
      let saved=localStorage.getItem('slabV4');
      if(saved){
        let d=JSON.parse(saved);
        if(d.ST&&d.ST[p.id]){
          ih=d.ST[p.id].ih||ih;
          it=d.ST[p.id].it||it;
        }
      }
    }catch(e){}
    ST[p.id]={
      px:[],ticks:0,tss:0,spikes:0,scalps:0,
      ih,it,
      vel:0,ratio:1,prevPx:null,
      indHist:[],
      direction:0, // -1=baissier, 0=neutre, 1=haussier
      consCount:0,
    };
  });
}

function saveData(){
  try{
    let data={gT,gS,gSc,ST:{}};
    PAIRS.forEach(p=>{
      data.ST[p.id]={ih:ST[p.id].ih,it:ST[p.id].it,spikes:ST[p.id].spikes,ticks:ST[p.id].ticks};
    });
    localStorage.setItem('slabV4',JSON.stringify(data));
  }catch(e){}
}
setInterval(saveData,5*60*1000);

// ═══════════════════════════════
// CALCULS 5 INDICATEURS
// ═══════════════════════════════
function ema(px,p){
  if(px.length<p)return null;
  let k=2/(p+1),e=px.slice(0,p).reduce((a,b)=>a+b,0)/p;
  for(let i=p;i<px.length;i++)e=px[i]*k+e*(1-k);
  return e;
}

function calc5(px){
  if(px.length<12)return null;
  let res={};

  // 1. RSI(2)
  let sl=px.slice(-3),g=0,l=0;
  for(let i=1;i<sl.length;i++){let d=sl[i]-sl[i-1];if(d>0)g+=d;else l+=Math.abs(d);}
  g/=2;l/=2;
  let rv=l===0?100:g===0?0:100-(100/(1+g/l));
  res.rsi={v:rv,sig:rv>=90||rv<=10};

  // 2. STOCH(3)
  let s3=px.slice(-3),smx=Math.max(...s3),smn=Math.min(...s3);
  let stv=smx===smn?50:((px[px.length-1]-smn)/(smx-smn))*100;
  res.stoch={v:stv,sig:stv>=85||stv<=15};

  // 3. WILLIAMS(3)
  let wmx=Math.max(...px.slice(-3)),wmn=Math.min(...px.slice(-3));
  let wv=wmx===wmn?-50:((wmx-px[px.length-1])/(wmx-wmn))*-100;
  res.wil={v:wv,sig:wv>=-10||wv<=-90};

  // 4. DeMarker(8)
  if(px.length>=9){
    let dm=0,dn=0;
    for(let i=px.length-8;i<px.length;i++){dm+=Math.max(0,px[i]-px[i-1]);dn+=Math.max(0,px[i-1]-px[i]);}
    let dv=dm+dn===0?0.5:dm/(dm+dn);
    res.dem={v:dv,sig:dv>=0.7||dv<=0.3};
  }else res.dem={v:null,sig:false};

  // 5. MOMENTUM(3)
  let atr=0;
  if(px.length>=4){for(let i=px.length-3;i<px.length;i++)atr+=Math.abs(px[i]-px[i-1]);atr/=3;}
  let mom=px.length>=4?px[px.length-1]-px[px.length-4]:null;
  res.mom={v:mom,sig:mom!==null&&Math.abs(mom)>atr*1.5};

  return res;
}

// ═══════════════════════════════
// DIRECTION SCALP
// ═══════════════════════════════
function calcDirection(px){
  if(px.length<8)return 0;
  let last8=px.slice(-8);
  let up=0,down=0;
  for(let i=1;i<last8.length;i++){
    if(last8[i]>last8[i-1])up++;
    else if(last8[i]<last8[i-1])down++;
  }
  if(up>=6)return 1;   // haussier
  if(down>=6)return -1; // baissier
  return 0;
}

// ═══════════════════════════════
// SIGNAL COMBINÉ
// ═══════════════════════════════
function getSignal(s,p,indRes){
  let pct=Math.min(99,Math.round(s.tss/p.max*100));
  let actifs=indRes?IND.filter(i=>indRes[i.id]&&indRes[i.id].sig).length:0;
  let dir=s.direction;

  if(pct>=90&&actifs>=3){
    return {type:'spike-imminent',icon:'🔴',text:'SPIKE IMMINENT',sub:'Prépare-toi — sors du scalp !',action:p.type==='boom'?'PRENDS BUY':'PRENDS SELL'};
  }
  if(pct>=70&&actifs>=2){
    return {type:'spike-alert',icon:'🟠',text:'SPIKE PROCHE',sub:'Commence à sortir du scalp',action:'ATTENTION SPIKE'};
  }
  if(dir===-1){
    return {type:'scalp-sell',icon:'🔻',text:'SCALP SELL',sub:'Petites bougies baissières',action:p.type==='boom'?'SELL les bougies':'SELL — sens du crash'};
  }
  if(dir===1){
    return {type:'scalp-buy',icon:'🔺',text:'SCALP BUY',sub:'Petites bougies haussières',action:p.type==='crash'?'BUY les bougies':'BUY — sens du boom'};
  }
  return {type:'neutral',icon:'⚪',text:'EN ATTENTE',sub:'Pas de signal clair',action:'—'};
}

// ═══════════════════════════════
// WEBSOCKET
// ═══════════════════════════════
function connectPair(p){
  let w=new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');
  ws[p.id]=w;
  w.onopen=()=>{
    w.send(JSON.stringify({ticks:p.id,subscribe:1}));
    document.getElementById('dot').className='dot on';
    document.getElementById('cTxt').textContent='LIVE';
  };
  w.onmessage=e=>{
    let d=JSON.parse(e.data);
    if(d.msg_type!=='tick')return;
    let price=parseFloat(d.tick.quote);
    let s=ST[p.id];
    if(!s)return;

    s.px.push(price);
    if(s.px.length>300)s.px.shift();
    s.ticks++;s.tss++;gT++;
    document.getElementById('gT').textContent=gT;

    if(s.prevPx!==null)s.vel=Math.abs(price-s.prevPx);
    s.prevPx=price;

    // Direction scalp
    s.direction=calcDirection(s.px);

    // Snapshot 5 indicateurs
    if(s.px.length>=12){
      let snap=calc5(s.px);
      if(snap){s.indHist.push(snap);if(s.indHist.length>200)s.indHist.shift();}
    }

    // Détection spike
    if(s.px.length>=6){
      let bodies=[];
      for(let i=s.px.length-5;i<s.px.length;i++)bodies.push(Math.abs(s.px[i]-s.px[i-1]));
      let cur=bodies[bodies.length-1];
      let avg=bodies.slice(0,-1).reduce((a,b)=>a+b,0)/4||0.00001;
      s.ratio=cur/avg;
      let threshold=p.id.includes('300')?0.30:p.id.includes('500')?0.50:1.00;
      let isSpike=cur>=threshold&&s.ratio>3;

      if(isSpike){
        s.spikes++;gS++;s.tss=0;
        document.getElementById('gS').textContent=gS;

        // 50 ticks AVANT
        let before=s.indHist.length>=50?s.indHist[s.indHist.length-50]:s.indHist.length>0?s.indHist[0]:null;
        if(before){
          IND.forEach(i=>{
            s.it[i.id]++;
            if(before[i.id]&&before[i.id].sig)s.ih[i.id]++;
          });
        }
        addJournal(p,s,true);
      } else {
        s.scalps++;gSc++;
        document.getElementById('gSc').textContent=gSc;
        if(s.ticks%20===0)addJournal(p,s,false);
      }
    }

    updatePair(p,s);
    updateGlobal();
  };
  w.onerror=()=>{};
  w.onclose=()=>{if(running)setTimeout(()=>connectPair(p),2000);};
}

// ═══════════════════════════════
// UI UPDATE
// ═══════════════════════════════
function updatePair(p,s){
  let pct=Math.min(99,Math.round(s.tss/p.max*100));
  let col=pct>=80?'var(--r)':pct>=50?'var(--o)':'var(--g)';

  let el=id=>document.getElementById(id+'_'+p.id);
  if(el('ps'))el('ps').textContent=s.spikes;
  if(el('pt'))el('pt').textContent=s.ticks+' ticks';
  if(el('tv'))el('tv').textContent=s.tss+'/'+p.max;
  let tp=el('tp');if(tp){tp.textContent=pct+'%';tp.style.color=col;}
  let tf=el('tf');if(tf){tf.style.width=pct+'%';tf.style.background=col;}
  let trc=document.getElementById('trc_'+p.id);
  if(trc)trc.classList.toggle('talert',pct>=80);
  let trp=document.getElementById('trp_'+p.id);
  if(trp){trp.textContent=pct+'%';trp.style.color=col;}
  let trf=document.getElementById('trf_'+p.id);
  if(trf){trf.style.width=pct+'%';trf.style.background=col;}
  let trs=document.getElementById('trs_'+p.id);
  if(trs)trs.textContent=s.tss+'/'+p.max;

  // Indicateurs live
  let indRes=s.px.length>=12?calc5(s.px):null;
  if(indRes){
    IND.forEach(i=>{
      let el2=document.getElementById('iv_'+p.id+'_'+i.id);
      let row=document.getElementById('ir_'+p.id+'_'+i.id);
      if(!el2)return;
      let rv=indRes[i.id];
      if(!rv||rv.v===null){el2.textContent='–';el2.className='iv';if(row)row.className='ind-row';return;}
      el2.textContent=typeof rv.v==='number'?rv.v.toFixed(2):'–';
      el2.className='iv'+(rv.sig?' active':'');
      if(row)row.className='ind-row'+(rv.sig?' active':'');
    });
  }

  // Signal principal
  let sig=getSignal(s,p,indRes);
  let sb=document.getElementById('sb_'+p.id);
  if(sb){
    sb.className='signal-box '+sig.type;
    sb.innerHTML=`<div class="signal-icon">${sig.icon}</div><div class="signal-text">${sig.text}</div><div class="signal-sub">${sig.sub}</div>`;
  }

  // Direction
  let du=document.getElementById('du_'+p.id);
  let dd=document.getElementById('dd_'+p.id);
  if(du&&dd){
    du.className='dir-box'+(s.direction===1?' active-buy':'');
    dd.className='dir-box'+(s.direction===-1?' active-sell':'');
  }
}

function updateGlobal(){
  // Classement 5 indicateurs
  let aH={},aT={};
  IND.forEach(i=>{aH[i.id]=0;aT[i.id]=0;});
  PAIRS.forEach(p=>{let s=ST[p.id];if(!s)return;IND.forEach(i=>{aH[i.id]+=s.ih[i.id];aT[i.id]+=s.it[i.id];});});
  let best=0;
  IND.forEach(i=>{let p=aT[i.id]>0?Math.round(aH[i.id]/aT[i.id]*100):0;if(p>best)best=p;});
  IND.forEach(i=>{
    let p=aT[i.id]>0?Math.round(aH[i.id]/aT[i.id]*100):0;
    let ep=document.getElementById('i5p_'+i.id);
    let ef=document.getElementById('i5f_'+i.id);
    let es=document.getElementById('i5s_'+i.id);
    let ec=document.getElementById('i5c_'+i.id);
    if(ep){ep.textContent=p+'%';ep.style.color=p>=70?'var(--g)':p>=40?'var(--o)':'var(--dim)';}
    if(ef)ef.style.width=p+'%';
    if(es)es.textContent=aH[i.id]+'/'+aT[i.id];
    if(ec)ec.classList.toggle('winner',p===best&&best>0);
  });
}

function addJournal(p,s,isSpike){
  let n=new Date();
  let time=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')+':'+n.getSeconds().toString().padStart(2,'0');
  let pct=Math.min(99,Math.round(s.tss/p.max*100));
  let indRes=s.px.length>=12?calc5(s.px):null;
  let actifs=indRes?IND.filter(i=>indRes[i.id]&&indRes[i.id].sig).length:0;
  let sig=getSignal(s,p,indRes);
  let dirTxt=s.direction===1?'🔺 HAUSSE':s.direction===-1?'🔻 BAISSE':'➡️ NEUTRE';

  let tr=document.createElement('tr');
  let badgeClass=isSpike?'bss':pct>=70?'bsal':'bsc';
  let badgeTxt=isSpike?'🔴 SPIKE':pct>=70?'⚠️ ALERTE':'🟢 SCALP';
  tr.innerHTML=`
    <td>${time}</td>
    <td>${p.sym}</td>
    <td><span class="bs ${badgeClass}">${badgeTxt}</span></td>
    <td>${s.tss}/${p.max}</td>
    <td style="color:${pct>=80?'var(--r)':pct>=50?'var(--o)':'var(--g)'};font-family:'Orbitron',monospace;font-weight:900">${pct}%</td>
    <td style="color:var(--b)">${actifs}/5</td>
    <td>${dirTxt}</td>
    <td style="color:var(--o);font-weight:700">${sig.action}</td>
  `;
  let jb=document.getElementById('jbody');
  jb.insertBefore(tr,jb.firstChild);
  if(jb.children.length>200)jb.removeChild(jb.lastChild);
}

function startClock(){
  setInterval(()=>{
    let n=new Date();
    document.getElementById('clk').textContent=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')+':'+n.getSeconds().toString().padStart(2,'0');
    if(t0){
      let el=Math.floor((n-t0)/1000);
      document.getElementById('sess').textContent=Math.floor(el/3600).toString().padStart(2,'0')+':'+Math.floor((el%3600)/60).toString().padStart(2,'0')+':'+(el%60).toString().padStart(2,'0');
    }
  },1000);
}

function startAll(){
  running=true;t0=new Date();initST();
  document.getElementById('btnGo').style.display='none';
  document.getElementById('btnStop').style.display='inline-block';
  PAIRS.forEach(p=>connectPair(p));
}

function stopAll(){
  running=false;saveData();
  Object.values(ws).forEach(w=>{try{w.close();}catch(e){}});
  document.getElementById('btnGo').style.display='inline-block';
  document.getElementById('btnStop').style.display='none';
  document.getElementById('dot').className='dot';
  document.getElementById('cTxt').textContent='OFF';
}

buildUI();startClock();
</script>
